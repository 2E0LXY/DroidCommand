name: Android test APK
on:
  push:
    branches: [main]
    paths: ['testapp/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['testapp/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon assembleDebug
      - name: Checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: droidcommand-testapp-debug
          path: |
            testapp/app/build/outputs/apk/debug/app-debug.apk
            testapp/app-debug.apk.sha256
